<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - EventDNA</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="auth-layout">
    <div class="auth-panel">
      <div class="register-card verify-card">
        <div class="logo-container">
           <img src="../../images/logo.png" alt="EventDNA" />
        </div>

        <h2 class="page-title">Forgot Password</h2>
        
        <p class="page-desc">
          Enter your email address and we'll send you a link to reset your password.
        </p>

        <form action="../verify-email/index.html" method="get">
          <div class="input-group">
            <label for="email" class="input-label">Email Address</label>
            <input type="email" id="email" placeholder="name@company.com" required class="email-input" />
          </div>

          <button type="submit" class="btn-primary submit-btn">Send Reset Link &rarr;</button>
        </form>

        <div class="back-link-container">
          <a href="../login/index.html" class="back-link">&larr; Back to Login</a>
        </div>

        <div class="footer-links">
          <a href="#">Privacy Policy</a>
          <span>&bull;</span>
          <a href="#">Terms</a>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
