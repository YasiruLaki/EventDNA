<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding Step 1 — Email Verification</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="auth-layout">
    <div class="auth-panel">
      <div class="register-card verify-card">

        <h2>Verify Your Email</h2>
        <p class="subtitle">
          We've sent a 6-digit verification code to<br>
          <strong style="color: var(--text-primary);">name@mail.com</strong>
        </p>

        <div class="code-row" aria-label="Verification code input">
          <input class="code-box" maxlength="1" inputmode="numeric" autocomplete="one-time-code" autofocus />
          <input class="code-box" maxlength="1" inputmode="numeric" />
          <input class="code-box" maxlength="1" inputmode="numeric" />
          <input class="code-box" maxlength="1" inputmode="numeric" />
          <input class="code-box" maxlength="1" inputmode="numeric" />
          <input class="code-box" maxlength="1" inputmode="numeric" />
        </div>

        <a class="btn-primary" id="verifyBtn" href="../../attendee/onboarding/index.html">Verify &amp; Continue →</a>

        <div class="verify-actions">
          <a class="btn-secondary" href="#">Resend Code</a>
          <a class="btn-secondary" href="#">Change Email</a>
        </div>

      </div>
    </div>
  </div>

  <script>
    const boxes = document.querySelectorAll('.code-box');

    boxes.forEach((box, index) => {
      box.addEventListener('input', () => {
        box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
        if (box.value && boxes[index + 1]) {
          boxes[index + 1].focus();
        }
      });

      box.addEventListener('keydown', (event) => {
        if (event.key === 'Backspace' && !box.value && boxes[index - 1]) {
          boxes[index - 1].focus();
        }
      });
    });

    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');
    const verifyBtn = document.getElementById('verifyBtn');
    
    if (role === 'organizer') {
      verifyBtn.href = '../../organizer/dashboard.html';
      verifyBtn.innerText = 'Continue to Organizer Portal →';
    } else {
      verifyBtn.href = '../../attendee/onboarding/index.html';
      verifyBtn.innerText = 'Verify & Continue →';
    }
  </script>
</body>

</html>
