<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Step 3 — Interests</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-panel">
      <div class="register-card interests-card">
        <div class="step-row">
          <span class="step-label">Step 3 of 3 · Interests</span>
          <span class="step-pct">100% Complete</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width: 100%"></div></div>

        <h2>Choose Your Interests</h2>
        <p class="subtitle">These help us recommend relevant events and meaningful connections.</p>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Search interests...">
        </div>

        <div class="chip-list">
          <button class="chip selected">Artificial Intelligence</button>
          <button class="chip">Machine Learning</button>
          <button class="chip">Medicine</button>
          <button class="chip">Healthcare</button>
          <button class="chip">Cybersecurity</button>
          <button class="chip">Business</button>
          <button class="chip">Startups</button>
          <button class="chip">Software Engineering</button>
          <button class="chip">Robotics</button>
          <button class="chip">Data Science</button>
          <button class="chip">Cloud Computing</button>
          <button class="chip">UX Design</button>
          <button class="chip">Research</button>
          <button class="chip">FinTech</button>
          <button class="chip">BioTech</button>
          <button class="chip">Entrepreneurship</button>
        </div>

        <div class="interest-actions">
          <a class="btn-primary" href="../dashboard/index.html">Complete Setup →</a>
          <a href="#" class="skip-link">Skip for now</a>
        </div>
      </div>
    </div>
  </div>

<script>
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('selected');
    });
  });
</script>
</body>
</html>
