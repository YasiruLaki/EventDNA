<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Step 2 — Skills & Interests</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-panel">
      <div class="register-card onboarding-card">
        <div class="progress-bar-container">
          <div class="progress-bar-segment active"></div>
          <div class="progress-bar-segment active"></div>
          <div class="progress-bar-segment"></div>
        </div>
        <div class="step-indicator">
          2 of 3 &mdash; Skills &amp; Interests
        </div>

        <h2 class="onboarding-title">Skills &amp; Interests</h2>
        <p class="subtitle onboarding-subtitle">
          These help us recommend relevant events and meaningful connections.
        </p>

        <div class="search-box">
          <input type="text" placeholder="Type Custom Skills and Hit Enter...">
        </div>

        <div class="skills-interests-section">
            <div class="section-label">Skills</div>
            <div class="chip-list">
              <button class="chip selected">JavaScript</button>
              <button class="chip">Python</button>
              <button class="chip selected">React</button>
              <button class="chip">Project Management</button>
              <button class="chip">UI/UX</button>
              <button class="chip">Public Speaking</button>
              <button class="chip">Data Analysis</button>
            </div>
        </div>

        <div class="skills-interests-section">
            <div class="section-label">Interests</div>
            <div class="chip-list">
              <button class="chip selected">Artificial Intelligence</button>
              <button class="chip">Machine Learning</button>
              <button class="chip">Medicine</button>
              <button class="chip">Healthcare</button>
              <button class="chip">Cybersecurity</button>
              <button class="chip">Business</button>
              <button class="chip">Startups</button>
            </div>
        </div>

        <a class="btn-primary onboarding-submit" href="../onboarding3/index.html">
          Continue &rarr;
        </a>

        <div class="footer-links onboarding-footer-links">
          <a href="#" class="skip-link">I'll complete this later</a>
        </div>
      </div>
    </div>
  </div>

<script>
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('selected');
    });
  });
</script>
</body>
</html>
