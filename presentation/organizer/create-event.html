<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Event - EventDNA</title>
  <link rel="stylesheet" href="../attendee/dashboard/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .form-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 2.5rem;
      margin-bottom: 2rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--secondary);
    }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      background: #f8fafc;
      color: var(--secondary);
      transition: all 0.2s;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79, 16, 255, 0.1);
    }
    .form-row {
      display: flex;
      gap: 1.5rem;
    }
    .form-row > * {
      flex: 1;
    }
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      background: #f8fafc;
      transition: all 0.2s;
    }
    .radio-label:has(input:checked) {
      border-color: var(--primary);
      background: var(--primary-tint);
    }
    .radio-label input {
      accent-color: var(--primary);
      width: 18px;
      height: 18px;
    }
    .radio-content strong {
      display: block;
      font-size: 0.95rem;
      color: var(--secondary);
    }
  </style>
</head>
<body style="background-color: #f9f9f9; min-height: 100vh;">
  <nav class="top-nav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="dashboard.html" class="nav-logo">
          <img src="../../images/logo.png" alt="EventDNA" class="nav-logo-img">
        </a>
        <div class="nav-links">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="dashboard.html#events" class="nav-link">My Events</a>
          <a href="create-event.html" class="nav-link active" style="box-shadow: inset 0 -2px 0 var(--primary); color: var(--primary); font-weight: 600;">Create Event</a>
        </div>
      </div>
      <div class="nav-right">
        <div class="nav-profile-menu">
          <button class="nav-profile-btn" aria-label="Profile Menu">
            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=150&q=80" alt="Profile" class="nav-avatar" />
            <span class="nav-profile-name">Hanan</span>
            <i data-lucide="chevron-down" style="width:16px;height:16px;"></i>
          </button>
          <div class="nav-dropdown">
            <a href="../../login/index.html" class="dropdown-item text-danger">Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="dashboard-shell">
    <main class="dashboard-content" style="max-width: 800px; margin: 0 auto; padding-bottom: 4rem;">
      
      <div style="margin-bottom: 2rem;">
        <h1 class="page-title">Create Event</h1>
        <p class="supporting-copy">Set up a new event for your organization.</p>
      </div>

      <div class="form-card">
        <h2 style="font-size: 1.1rem; font-weight: 700; color: var(--secondary); margin: 0 0 1.5rem 0; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">Basic Information</h2>
        
        <div class="form-group">
          <label>Event Name</label>
          <input type="text" class="form-input" placeholder="e.g. AI Innovation Summit 2026">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea class="form-textarea" rows="4" placeholder="Briefly describe what this event is about..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date</label>
            <input type="date" class="form-input">
          </div>
          <div class="form-group">
            <label>Start Time</label>
            <input type="time" class="form-input">
          </div>
          <div class="form-group">
            <label>End Time</label>
            <input type="time" class="form-input">
          </div>
        </div>
      </div>

      <div class="form-card">
        <h2 style="font-size: 1.1rem; font-weight: 700; color: var(--secondary); margin: 0 0 1.5rem 0; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">Location & Details</h2>
        
        <div class="form-group">
          <label>Venue / Location</label>
          <input type="text" class="form-input" placeholder="e.g. BMICH, Colombo">
        </div>

        <div class="form-group">
          <label>Address</label>
          <input type="text" class="form-input" placeholder="Full street address">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Capacity</label>
            <input type="number" class="form-input" placeholder="Max attendees">
          </div>
          <div class="form-group">
            <label>Interest Tags (Comma separated)</label>
            <input type="text" class="form-input" placeholder="Technology, Business, AI">
          </div>
        </div>
      </div>

      <div class="form-card">
        <h2 style="font-size: 1.1rem; font-weight: 700; color: var(--secondary); margin: 0 0 1.5rem 0; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">Registration</h2>
        
        <div class="form-row">
          <div class="form-group">
            <label>Registration Opens</label>
            <input type="date" class="form-input">
          </div>
          <div class="form-group">
            <label>Registration Closes</label>
            <input type="date" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label>Visibility</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="visibility" value="public" checked>
              <div class="radio-content">
                <strong>Public</strong>
              </div>
            </label>
            <label class="radio-label">
              <input type="radio" name="visibility" value="invite">
              <div class="radio-content">
                <strong>Invite Only</strong>
              </div>
            </label>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <a href="dashboard.html" class="btn-secondary" style="padding: 0.75rem 1.5rem; text-decoration: none;">Cancel</a>
        <a href="event-details.html" class="btn-primary" style="padding: 0.75rem 1.5rem; text-decoration: none;">Create Event</a>
      </div>

    </main>
  </div>

  <script>
    lucide.createIcons();
    
    // Simple profile menu toggle
    const profileBtn = document.querySelector('.nav-profile-btn');
    const profileDropdown = document.querySelector('.nav-dropdown');
    
    if (profileBtn && profileDropdown) {
      profileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        profileDropdown.classList.toggle('show');
      });
      
      document.addEventListener('click', () => {
        profileDropdown.classList.remove('show');
      });
    }
  </script>
</body>
</html>
