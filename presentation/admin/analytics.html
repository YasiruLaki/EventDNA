<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Analytics - EventDNA Admin</title>
  <link rel="stylesheet" href="../../globals.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #f9f9f9; margin: 0; font-family: 'Inter', -apple-system, sans-serif; }
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-sidebar { width: 250px; background: #fff; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .admin-logo { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border-color); }
    .admin-logo img { height: 28px; }
    .admin-nav { padding: 1.5rem 1rem; flex: 1; }
    .admin-nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--text-secondary); text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; margin-bottom: 0.5rem; transition: all 0.2s; }
    .admin-nav-item:hover { background: #f8fafc; color: var(--secondary); }
    .admin-nav-item.active { background: var(--primary-tint); color: var(--primary); }
    .admin-footer { padding: 1.5rem 1rem; border-top: 1px solid var(--border-color); }
    
    .admin-content { flex: 1; padding: 2.5rem 3rem; overflow-y: auto; }
    .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5rem; }
    .page-title { font-size: 1.75rem; font-weight: 800; color: var(--secondary); margin: 0; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 3rem; }
    .stat-card { background: #fff; border: 1px solid rgba(226, 232, 240, 0.9); border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .stat-value { font-size: 2rem; font-weight: 800; color: var(--secondary); margin: 0; }
    .stat-label { color: var(--text-secondary); font-size: 0.95rem; font-weight: 600; margin: 0.25rem 0 0 0; }
    
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    .chart-card { background: #fff; border: 1px solid rgba(226, 232, 240, 0.9); border-radius: 12px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .chart-card h3 { margin: 0 0 1.5rem 0; font-size: 1.1rem; font-weight: 800; color: var(--secondary); }
    .placeholder-chart { height: 200px; display: flex; align-items: flex-end; gap: 10%; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; margin-top: 1rem; }
    .bar { flex: 1; background: var(--primary-tint); border-radius: 4px 4px 0 0; position: relative; }
    .bar::after { content: ''; position: absolute; inset: 0; background: var(--primary); border-radius: 4px 4px 0 0; opacity: 0.8; }
    
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <img src="../../images/logo.png" alt="EventDNA" />
        <span style="display: block; font-size: 0.75rem; font-weight: 800; color: var(--primary); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.25rem;">Admin</span>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item"><i data-lucide="layout-dashboard" style="width: 18px;"></i> Dashboard</a>
        <a href="users.html" class="admin-nav-item"><i data-lucide="users" style="width: 18px;"></i> Users</a>
        <a href="events.html" class="admin-nav-item"><i data-lucide="calendar" style="width: 18px;"></i> Events</a>
        <a href="moderation.html" class="admin-nav-item"><i data-lucide="shield-alert" style="width: 18px;"></i> Moderation</a>
        <a href="analytics.html" class="admin-nav-item active"><i data-lucide="bar-chart-2" style="width: 18px;"></i> Analytics</a>
      </nav>
      <div class="admin-footer">
        <a href="#" class="admin-nav-item"><i data-lucide="settings" style="width: 18px;"></i> Settings</a>
        <a href="../auth/login/index.html" class="admin-nav-item" style="color: var(--danger);"><i data-lucide="log-out" style="width: 18px;"></i> Log Out</a>
      </div>
    </aside>

    <main class="admin-content">
      <div class="page-header">
        <h1 class="page-title">Platform Analytics</h1>
      </div>

      <div class="stats-grid">
        <article class="stat-card">
          <h2 class="stat-value">1,248</h2>
          <p class="stat-label">Users</p>
        </article>
        <article class="stat-card">
          <h2 class="stat-value">86</h2>
          <p class="stat-label">Events</p>
        </article>
        <article class="stat-card">
          <h2 class="stat-value">4,921</h2>
          <p class="stat-label">Registrations</p>
        </article>
        <article class="stat-card">
          <h2 class="stat-value">3,842</h2>
          <p class="stat-label">Check-ins</p>
        </article>
        <article class="stat-card">
          <h2 class="stat-value">324</h2>
          <p class="stat-label">Connections</p>
        </article>
        <article class="stat-card">
          <h2 class="stat-value">42</h2>
          <p class="stat-label">Communities</p>
        </article>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3>User Growth</h3>
          <div class="placeholder-chart">
            <div class="bar" style="height: 30%;"></div>
            <div class="bar" style="height: 45%;"></div>
            <div class="bar" style="height: 60%;"></div>
            <div class="bar" style="height: 50%;"></div>
            <div class="bar" style="height: 80%;"></div>
            <div class="bar" style="height: 100%;"></div>
          </div>
          <div style="display: flex; justify-content: space-between; margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.8rem; font-weight: 600;">
            <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span>
          </div>
        </div>
        
        <div class="chart-card">
          <h3>Event Activity</h3>
          <div class="placeholder-chart">
            <div class="bar" style="height: 40%; background: rgba(91,33,255,0.1);"><div style="position:absolute; inset:0; background:var(--secondary); opacity:0.8; border-radius:4px 4px 0 0;"></div></div>
            <div class="bar" style="height: 25%; background: rgba(91,33,255,0.1);"><div style="position:absolute; inset:0; background:var(--secondary); opacity:0.8; border-radius:4px 4px 0 0;"></div></div>
            <div class="bar" style="height: 70%; background: rgba(91,33,255,0.1);"><div style="position:absolute; inset:0; background:var(--secondary); opacity:0.8; border-radius:4px 4px 0 0;"></div></div>
            <div class="bar" style="height: 55%; background: rgba(91,33,255,0.1);"><div style="position:absolute; inset:0; background:var(--secondary); opacity:0.8; border-radius:4px 4px 0 0;"></div></div>
            <div class="bar" style="height: 90%; background: rgba(91,33,255,0.1);"><div style="position:absolute; inset:0; background:var(--secondary); opacity:0.8; border-radius:4px 4px 0 0;"></div></div>
            <div class="bar" style="height: 85%; background: rgba(91,33,255,0.1);"><div style="position:absolute; inset:0; background:var(--secondary); opacity:0.8; border-radius:4px 4px 0 0;"></div></div>
          </div>
          <div style="display: flex; justify-content: space-between; margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.8rem; font-weight: 600;">
            <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
